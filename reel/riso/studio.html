<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Riso career reel</title>
<style>@font-face { font-family: "Archivo Black"; src: url(assets/fonts/ArchivoBlack-latin.woff2) format("woff2"); font-display: block; }</style>
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F4EFE6; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="60" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/riso.js"></script>
<script src="src/timeline.js"></script>
<script src="src/me.js"></script>
<script src="src/scenes/career.js"></script>
<script>
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
